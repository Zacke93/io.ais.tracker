<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/homey.css">
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
        .container {
            padding: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .buttons {
            margin-top: 20px;
            text-align: right;
        }

        .btn {
            padding: 8px 15px;
            margin-left: 10px;
            cursor: pointer;
        }

        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
            display: none;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .info {
            background-color: #e2f3fc;
            color: #0c5460;
        }

        .instructions {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
        }

        .instructions h3 {
            margin-top: 0;
            color: #495057;
        }

        .instructions ul {
            margin-bottom: 0;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        .attribution {
            margin-top: 10px;
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <!-- Fable-granskningen 2026-08-10 (FG-B3s): sidan hade TVÅ konkurrerande
         översättningsvägar — data-i18n (Homey-språket) och en inline-tabell på
         navigator.language (webbläsarspråket) — vilket gav blandspråkig sida när
         de två skilde sig. Nu gäller Homeys system för ALLT: varje användarsynlig
         sträng bor i /locales/*.json. Statiska element hämtas deklarativt med
         data-i18n (homey.js fyller dem vid load), dynamiska strängar via
         Homey.__() i scriptet. Elementen lämnas TOMMA precis som SDK-exemplet
         visar — locales/ är enda sanningskällan, ingen engelsk dublett i markupen.
         HTML får INTE ligga i locale-strängar (odokumenterat om homey.js sätter
         textContent eller innerHTML), därför står <strong>/<a> kvar som riktig
         markup med egna data-i18n-fragment runt sig. -->
    <div class="container">
        <h1 data-i18n="settings.title"><!-- locales: settings.title --></h1>

        <div class="field">
            <label class="label" for="ais_api_key" data-i18n="settings.api_key"><!-- locales --></label>
            <!-- ChatGPT-granskningen 2026-07-10 (I2): password-typ (nyckeln är
                 en hemlighet) + generisk placeholder — riktiga aisstream-nycklar
                 är 40 hex-tecken, INTE UUID som gamla platshållaren antydde.
                 FG-B3s: placeholder är ett attribut, inte elementinnehåll — det
                 dokumenterade data-i18n fyller innehåll, så placeholdern sätts
                 med Homey.__() i scriptet nedan. -->
            <input class="input" id="ais_api_key" type="password" />
            <p class="description">
                <span data-i18n="settings.api_key_description"><!-- locales --></span>
                <a href="https://aisstream.io" target="_blank">aisstream.io</a>
            </p>
        </div>

        <!-- Etapp 2 (2026-08-02): AISHub som andra källa. Username är en
             KONTOUPPGIFT (ingen hemlighet) → type=text, lättare felsökning.
             Whitelist-validering i scriptet: klistrad URL eller &/?/mellanslag
             hade annars förstört ALLA efterföljande query-parametrar. -->
        <div class="field">
            <label class="label" for="aishub_username" data-i18n="settings.aishub_username"><!-- locales --></label>
            <input class="input" id="aishub_username" type="text" />
            <p class="description">
                <span data-i18n="settings.aishub_username_description"><!-- locales --></span>
                <a href="https://www.aishub.net" target="_blank">aishub.net</a>
            </p>
        </div>

        <!-- Källvalet är ett rent beteendeval (samma precedens som debug_level:
             bara här, inte i manifestet). 'aisstream' FÖRST så pre-load-
             renderingen är korrekt för befintliga användare. value-attributen är
             beteendebärande (ALLOWED_SOURCES) och ÖVERSÄTTS INTE — bara etiketten. -->
        <div class="field">
            <label class="label" for="ais_source" data-i18n="settings.ais_source"><!-- locales --></label>
            <select class="input" id="ais_source">
                <option value="aisstream" data-i18n="settings.ais_source_aisstream"><!-- locales --></option>
                <option value="shadow" data-i18n="settings.ais_source_shadow"><!-- locales --></option>
                <option value="both" data-i18n="settings.ais_source_both"><!-- locales --></option>
                <option value="aishub" data-i18n="settings.ais_source_aishub"><!-- locales --></option>
            </select>
            <p class="description" data-i18n="settings.ais_source_description"><!-- locales --></p>
        </div>

        <div class="field">
            <label class="label" for="debug_level" data-i18n="settings.debug_level"><!-- locales --></label>
            <select class="input" id="debug_level">
                <option value="off" data-i18n="settings.debug_level_off"><!-- locales --></option>
                <option value="basic" data-i18n="settings.debug_level_basic"><!-- locales --></option>
                <option value="detailed" data-i18n="settings.debug_level_detailed"><!-- locales --></option>
                <option value="full" data-i18n="settings.debug_level_full"><!-- locales --></option>
            </select>
            <p class="description" data-i18n="settings.debug_level_description"><!-- locales --></p>
        </div>

        <div id="status" class="status"></div>

        <div class="buttons">
            <button id="save" class="btn btn-primary" data-i18n="settings.save"><!-- locales --></button>
        </div>

        <!-- FG-B3s: instruktionsblockets listrader bestod av "<strong>etikett</strong>
             brödtext" (och en länk). Eftersom locale-strängar hålls HTML-fria är
             varje rad uppdelad i två nycklar — etikett + text — med markupen kvar
             i HTML:en. Länktexterna är domännamn och översätts inte. -->
        <div class="instructions">
            <h3 data-i18n="settings.instructions_title"><!-- locales --></h3>
            <p data-i18n="settings.instructions_intro"><!-- locales --></p>
            <ul>
                <li><strong data-i18n="settings.instructions_valid_label"><!-- locales --></strong>
                    <span data-i18n="settings.instructions_valid_text"><!-- locales --></span></li>
                <li><strong data-i18n="settings.instructions_invalid_label"><!-- locales --></strong>
                    <span data-i18n="settings.instructions_invalid_text"><!-- locales --></span></li>
                <li><strong data-i18n="settings.instructions_help_label"><!-- locales --></strong>
                    <span data-i18n="settings.instructions_help_text"><!-- locales --></span>
                    <a href="https://aisstream.io" target="_blank">aisstream.io</a></li>
                <li><strong data-i18n="settings.instructions_aishub_label"><!-- locales --></strong>
                    <span data-i18n="settings.instructions_aishub_text"><!-- locales --></span></li>
            </ul>
            <p><em data-i18n="settings.instructions_footer"><!-- locales --></em></p>
            <p class="attribution" data-i18n="settings.attribution"><!-- locales --></p>
        </div>
    </div>

    <script>
        function onHomeyReady(Homey) {
            const apiKeyInput = document.getElementById('ais_api_key');
            const aishubUsernameInput = document.getElementById('aishub_username');
            const aisSourceSelect = document.getElementById('ais_source');
            const debugLevelSelect = document.getElementById('debug_level');
            const saveButton = document.getElementById('save');
            const statusDiv = document.getElementById('status');

            // Whitelist för AISHub-username: fångar klistrad URL, &, ?, =
            // och mellanslag som annars förstör query-strängen mot ws.php.
            const AISHUB_USERNAME_RE = /^[A-Za-z0-9._-]{3,64}$/;
            const ALLOWED_SOURCES = ['aisstream', 'shadow', 'both', 'aishub'];

            // Fable-granskningen 2026-08-10 (FG-B3s): ersätter den gamla
            // inline-I18N-tabellen från ChatGPT-granskningen 2026-07-10 (H2).
            // Den valde språk på navigator.language (webbläsarspråket) medan
            // data-i18n-elementen följde HOMEY-språket → blandspråkig sida.
            // Nu gäller Homeys system för allt: Homey.__(nyckel [, tokens])
            // slår upp i /locales/<homey-språk>.json, med __token__-syntax för
            // interpolation. Inget navigator.language-beroende kvar.
            // Placeholders är attribut och nås inte av data-i18n — de sätts här.
            apiKeyInput.placeholder = Homey.__('settings.api_key_placeholder');
            aishubUsernameInput.placeholder = Homey.__('settings.aishub_username_placeholder');

            // Senast sparade värden — ALLA fyra nycklar skrivs ENDAST vid
            // faktisk ändring (motivet från I2-granskningen gäller varje
            // källnyckel: varje skrivning startar om en källa/omkonfigurerar
            // muxen; ais_source-skrivningar utan ändring hade dessutom
            // triggat applySourceConfig i onödan vid varje "Spara").
            let storedApiKey = '';
            let storedAishubUsername = '';
            let storedAisSource = 'aisstream';

            // Helgranskning 2026-07-06 (kontrakt-homey#1): spara-knappen får
            // inte skriva förrän ALLT laddats — annars skrivs select-defaults
            // över lagrade värden (tyst nedgradering). Räknare i stället för
            // en boolean nu när fyra nycklar laddas parallellt.
            let pending = 4;
            saveButton.disabled = true;
            const loaded = function () {
                pending--;
                if (pending === 0) saveButton.disabled = false;
            };

            Homey.get('ais_api_key', function (err, apiKey) {
                if (!err && apiKey) {
                    storedApiKey = String(apiKey).trim();
                    apiKeyInput.value = storedApiKey;
                }
                loaded();
            });
            Homey.get('aishub_username', function (err, username) {
                if (!err && username) {
                    storedAishubUsername = String(username).trim();
                    aishubUsernameInput.value = storedAishubUsername;
                }
                loaded();
            });
            Homey.get('ais_source', function (err, source) {
                if (!err && source && ALLOWED_SOURCES.indexOf(String(source)) !== -1) {
                    storedAisSource = String(source);
                }
                aisSourceSelect.value = storedAisSource;
                loaded();
            });
            Homey.get('debug_level', function (err, debugLevel) {
                if (!err && debugLevel) {
                    debugLevelSelect.value = debugLevel;
                } else {
                    debugLevelSelect.value = 'basic'; // Default to basic
                }
                loaded();
            });

            // Sekventiell skrivkedja: skriv nästa nyckel ENDAST om den ändrats.
            function saveChanged(pairs, done) {
                const next = pairs.shift();
                if (!next) { done(null); return; }
                if (!next.changed) { saveChanged(pairs, done); return; }
                Homey.set(next.key, next.value, function (err) {
                    if (err) { done(err); return; }
                    next.commit();
                    saveChanged(pairs, done);
                });
            }

            // Save settings
            saveButton.addEventListener('click', function () {
                if (pending > 0) {
                    showStatus(Homey.__('settings.status_still_loading'), 'info');
                    return;
                }
                const apiKey = apiKeyInput.value.trim();
                const aishubUsername = aishubUsernameInput.value.trim();
                const aisSource = ALLOWED_SOURCES.indexOf(aisSourceSelect.value) !== -1
                    ? aisSourceSelect.value
                    : 'aisstream';
                const debugLevel = debugLevelSelect.value;

                const apiKeyChanged = apiKey !== storedApiKey;
                const usernameChanged = aishubUsername !== storedAishubUsername;
                const sourceChanged = aisSource !== storedAisSource;

                // Validera bara när en NY, icke-tom nyckel angetts. Debug-nivån
                // ska kunna sparas utan API-nyckel.
                if (apiKeyChanged && apiKey && apiKey.length < 20) {
                    showStatus(Homey.__('settings.status_key_too_short'), 'error');
                    return;
                }
                if (aishubUsername && !AISHUB_USERNAME_RE.test(aishubUsername)) {
                    showStatus(Homey.__('settings.status_bad_username'), 'error');
                    return;
                }
                if (aisSource !== 'aisstream' && !aishubUsername) {
                    showStatus(Homey.__('settings.status_source_needs_username'), 'error');
                    return;
                }

                showStatus(Homey.__('settings.status_saving'), 'info');

                Homey.set('debug_level', debugLevel, function (err) {
                    if (err) {
                        // FG-B3s: felsträngen interpoleras med Homeys __token__-
                        // syntax i stället för konkatenering. String() bevarar
                        // exakt tidigare utfall även när err.message saknas.
                        showStatus(Homey.__('settings.status_save_debug_error', { error: String(err.message) }), 'error');
                        return;
                    }

                    saveChanged([
                        {
                            key: 'aishub_username',
                            value: aishubUsername,
                            changed: usernameChanged,
                            commit: function () { storedAishubUsername = aishubUsername; },
                        },
                        {
                            key: 'ais_source',
                            value: aisSource,
                            changed: sourceChanged,
                            commit: function () { storedAisSource = aisSource; },
                        },
                        {
                            // Sist: ais_api_key — skrivningen triggar käll-
                            // omkonfigurationen i appen, så username/källval
                            // ska redan vara på plats när den landar.
                            key: 'ais_api_key',
                            value: apiKey,
                            changed: apiKeyChanged,
                            commit: function () { storedApiKey = apiKey; },
                        },
                    ], function (err2) {
                        if (err2) {
                            showStatus(Homey.__('settings.status_save_error', { error: String(err2.message) }), 'error');
                            return;
                        }
                        if (apiKeyChanged && !apiKey) {
                            showStatus(Homey.__('settings.status_saved_key_removed'), 'success');
                        } else if (apiKeyChanged || usernameChanged || sourceChanged) {
                            showStatus(Homey.__('settings.status_saved_connecting'), 'success');
                        } else {
                            showStatus(Homey.__('settings.status_saved'), 'success');
                        }
                    });
                });
            });

            // Helper for status messages
            function showStatus(message, type) {
                statusDiv.textContent = message;
                statusDiv.className = 'status ' + type;
                statusDiv.style.display = 'block';

                if (type !== 'info') {
                    setTimeout(function () {
                        statusDiv.style.display = 'none';
                    }, 5000);
                }
            }

            Homey.ready();
        }
    </script>
</body>

</html>
